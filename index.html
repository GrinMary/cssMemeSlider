<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Slider</title>
</head>
<body>
    <div class="slider">
        <input type="radio" name="slide" id="slide-1">
        <input type="radio" name="slide" id="slide-2">
        <input type="radio" name="slide" id="slide-3" checked >
        <input type="radio" name="slide" id="slide-4">
        <div class="slider-content">
            <div class="slider-items">
                <div class="slider-item">
                    <div class="slider-img">
                        <img src="./assets/winter.jpg" alt="winter">
                    </div>
                </div> 
                <div class="slider-item">
                    <div class="slider-img">
                        <img src="./assets/spring.jpg" alt="spring">
                    </div>
                </div>     
                <div class="slider-item">
                    <div class="slider-img">
                        <img src="./assets/summer.jpg" alt="summer">
                    </div>
                </div>   
                <div class="slider-item">
                    <div class="slider-img">
                        <img src="./assets/autumn.jpg" alt="autumn">
                    </div>
                </div>   
            </div>
        </div>
        <div class="slider-bottom">
            <div class="slider-content-text">
                <span class="slider-text text-1">Winter</span>
                <span class="slider-text text-2">Spring</span>
                <span class="slider-text text-3">Summer</span>
                <span class="slider-text text-4">Autumn</span>
            </div>
            <div class="slider-controls">
                <label for="slide-1"></label>
                <label for="slide-2"></label>
                <label for="slide-3"></label>
                <label for="slide-4"></label>
            </div>
        </div>
    </div> 
</body>
</html>
